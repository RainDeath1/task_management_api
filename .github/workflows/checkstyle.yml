
name: Checkstyle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn --batch-mode checkstyle:check -Dcheckstyle.failOnViolation=false

      - name: Publish Checkstyle annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path("target/checkstyle-result.xml")

          if not report.exists():
              print("::error::Checkstyle report not found")
              sys.exit(1)

          root = ET.parse(report).getroot()
          count = 0

          for file in root.findall("file"):
              path = Path(file.get("name", ""))
              try:
                  path = path.relative_to(Path.cwd())
              except ValueError:
                  pass

              for error in file.findall("error"):
                  count += 1
                  line = error.get("line", "1")
                  message = error.get("message", "")
                  message = message.replace("%", "%25")
                  message = message.replace("\r", "%0D")
                  message = message.replace("\n", "%0A")

                  print(
                      f"::error file={path.as_posix()},"
                      f"line={line},title=Checkstyle::{message}"
                  )

          print(f"Checkstyle violations: {count}")
          sys.exit(1 if count else 0)
          PY
